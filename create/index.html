<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c4rds — Importa Tessera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A1628;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #132238;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #8899AA; font-size: 15px; margin-bottom: 28px; }
        .info {
            background: #0D1B2A;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        .info-row { display: flex; justify-content: space-between; padding: 6px 0; }
        .info-label { color: #6688AA; font-size: 13px; }
        .info-value { color: #fff; font-weight: 600; font-size: 14px; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: #0A3D6B;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover { background: #0D4F8B; }
        .fallback {
            margin-top: 16px;
            color: #5577AA;
            font-size: 13px;
        }
        .fallback a { color: #6699CC; }
        #status { color: #44AA66; font-size: 14px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 108 108" width="80" height="80">
                <!-- Sfondo Blu -->
                <rect width="108" height="108" fill="#0A3D6B" rx="18"/>
                
                <!-- Card 1 (Bottom, tilted left) -->
                <g transform="rotate(-20 54 54)">
                    <path fill="rgba(255,255,255,0.3)" d="M35,38 h38 a6,6 0 0 1 6,6 v20 a6,6 0 0 1 -6,6 h-38 a6,6 0 0 1 -6,-6 v-20 a6,6 0 0 1 6,-6 z" />
                </g>
                
                <!-- Card 2 (Middle) -->
                <g transform="rotate(-10 54 54)">
                    <path fill="rgba(255,255,255,0.6)" d="M35,38 h38 a6,6 0 0 1 6,6 v20 a6,6 0 0 1 -6,6 h-38 a6,6 0 0 1 -6,-6 v-20 a6,6 0 0 1 6,-6 z" />
                </g>
                
                <!-- Card 3 (Front, straight) -->
                <path fill="#FFFFFF" d="M35,38 h38 a6,6 0 0 1 6,6 v20 a6,6 0 0 1 -6,6 h-38 a6,6 0 0 1 -6,-6 v-20 a6,6 0 0 1 6,-6 z" />
                
                <!-- Lettera 'c' -->
                <path fill="none" stroke="#0A3D6B" stroke-width="3.5" stroke-linecap="round" d="M48,49 C43,46 39,49 39,54 C39,59 43,62 48,59" />
                
                <!-- Numero '4' -->
                <path fill="none" stroke="#0A3D6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M61,47 L53,56 L64,56 M61,47 L61,61" />
            </svg>
        </div>
        <h1>Importa Tessera</h1>
        <p class="subtitle">Qualcuno ti ha condiviso una tessera fedeltà</p>
        
        <div class="info" id="card-info">
            <div class="info-row">
                <span class="info-label">Negozio</span>
                <span class="info-value" id="card-name">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Codice</span>
                <span class="info-value" id="card-barcode">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Formato</span>
                <span class="info-value" id="card-format">—</span>
            </div>
        </div>

        <a id="open-btn" class="btn" href="#">Apri nell'app c4rds</a>
        <p id="status">✓ Redirect in corso...</p>
        <p class="fallback">Non hai l'app? Chiedi a chi ti ha mandato il link!</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || '';
        const barcode = params.get('barcode') || '';
        const format = params.get('format') || '';
        const owner = params.get('owner') || '';

        document.getElementById('card-name').textContent = name || '—';
        document.getElementById('card-barcode').textContent = barcode || '—';
        document.getElementById('card-format').textContent = format || '—';

        // intent:// is the official Android mechanism to open apps from web pages
        const intentUrl = 'intent://create?' +
            'name=' + encodeURIComponent(name) +
            '&barcode=' + encodeURIComponent(barcode) +
            '&format=' + encodeURIComponent(format) +
            '&owner=' + encodeURIComponent(owner) +
            '#Intent;scheme=c4rds;package=io.github.ar3ac.c4rds;end';
        
        const directUrl = 'c4rds://create?' +
            'name=' + encodeURIComponent(name) +
            '&barcode=' + encodeURIComponent(barcode) +
            '&format=' + encodeURIComponent(format) +
            '&owner=' + encodeURIComponent(owner);

        document.getElementById('open-btn').href = intentUrl;

        document.getElementById('open-btn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('status').style.display = 'block';
            window.location.href = intentUrl;
            setTimeout(function() {
                window.location.href = directUrl;
            }, 500);
        });
    </script>
</body>
</html>
