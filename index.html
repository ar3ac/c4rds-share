<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c4rds — Le tue tessere fedeltà</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A1628;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #132238;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        h1 { font-size: 28px; margin-bottom: 12px; }
        .subtitle { color: #8899AA; font-size: 16px; margin-bottom: 28px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 108 108" width="80" height="80">
                <!-- Sfondo Blu -->
                <rect width="108" height="108" fill="#0A3D6B" rx="18"/>
                
                <!-- Card 1 (Bottom, tilted left) -->
                <g transform="rotate(-20 54 54)">
                    <path fill="rgba(255,255,255,0.3)" d="M35,38 h38 a6,6 0 0 1 6,6 v20 a6,6 0 0 1 -6,6 h-38 a6,6 0 0 1 -6,-6 v-20 a6,6 0 0 1 6,-6 z" />
                </g>
                
                <!-- Card 2 (Middle) -->
                <g transform="rotate(-10 54 54)">
                    <path fill="rgba(255,255,255,0.6)" d="M35,38 h38 a6,6 0 0 1 6,6 v20 a6,6 0 0 1 -6,6 h-38 a6,6 0 0 1 -6,-6 v-20 a6,6 0 0 1 6,-6 z" />
                </g>
                
                <!-- Card 3 (Front, straight) -->
                <path fill="#FFFFFF" d="M35,38 h38 a6,6 0 0 1 6,6 v20 a6,6 0 0 1 -6,6 h-38 a6,6 0 0 1 -6,-6 v-20 a6,6 0 0 1 6,-6 z" />
                
                <!-- Lettera 'c' -->
                <path fill="none" stroke="#0A3D6B" stroke-width="3.5" stroke-linecap="round" d="M48,49 C43,46 39,49 39,54 C39,59 43,62 48,59" />
                
                <!-- Numero '4' -->
                <path fill="none" stroke="#0A3D6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M61,47 L53,56 L64,56 M61,47 L61,61" />
            </svg>
        </div>
        <h1>c4rds</h1>
        <p class="subtitle">Tutte le tue tessere fedeltà in un'app.<br>Semplice. Veloce. Offline.</p>
    </div>
</body>
</html>
